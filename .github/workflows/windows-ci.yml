name: Windows and Linux CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows WinUI and unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: desktop/**/*.csproj

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Use Git for Windows GnuPG
        shell: pwsh
        run: |
          $gpg = "C:\Program Files\Git\usr\bin"
          if (-not (Test-Path (Join-Path $gpg "gpg.exe"))) {
            throw "gpg.exe was not found next to Git for Windows."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gpg
          & (Join-Path $gpg "gpg.exe") --version

      - name: Build WinUI, publish Companion, and run dotnet tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          & powershell -NoProfile -File ./scripts/verify-windows.ps1 -ResultsDir test-results *> test-results/verify-windows.log
          $code = $LASTEXITCODE
          Get-Content test-results/verify-windows.log
          exit $code

      - name: Backend unit tests
        shell: pwsh
        working-directory: backend
        run: |
          python -m pip install -r requirements-ci.txt
          New-Item -ItemType Directory -Force -Path ../test-results | Out-Null
          python -m pytest tests/test_byo_secrets.py tests/test_setup_center.py tests/test_smart_home.py tests/test_writing_assistant.py tests/test_code_and_assist.py tests/test_backup_gpg.py tests/test_assist_receipt.py tests/test_owner_rail.py tests/test_brain_route.py tests/test_llm_provider.py tests/test_odysseus_client.py tests/test_report_fixes.py tests/test_letter_unlock.py tests/test_session_renew.py tests/test_buyer_runtime.py -q --junitxml=../test-results/backend-windows.xml

      - name: Upload Windows logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: test-results/
          if-no-files-found: warn

  linux:
    name: Linux backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install GnuPG
        run: sudo apt-get update && sudo apt-get install -y gnupg

      - name: Backend unit tests
        working-directory: backend
        run: |
          python -m pip install -r requirements-ci.txt
          mkdir -p ../test-results
          python -m pytest tests/test_byo_secrets.py tests/test_setup_center.py tests/test_smart_home.py tests/test_writing_assistant.py tests/test_code_and_assist.py tests/test_backup_gpg.py tests/test_assist_receipt.py tests/test_owner_rail.py tests/test_brain_route.py tests/test_llm_provider.py tests/test_odysseus_client.py tests/test_report_fixes.py tests/test_letter_unlock.py tests/test_session_renew.py tests/test_buyer_runtime.py -q --junitxml=../test-results/backend-linux.xml

      - name: Upload Linux logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: test-results/
          if-no-files-found: warn
