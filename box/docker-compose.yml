# Heirloom Twin Box. Data lives under /var/lib/heirloom, not in the git tree.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - /var/lib/heirloom/mongo:/data/db
    networks:
      - heirloom

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - /var/lib/heirloom/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - heirloom

  api:
    build:
      context: ..
      dockerfile: box/Dockerfile.api
    restart: unless-stopped
    env_file:
      - /var/lib/heirloom/box.env
    volumes:
      - /var/lib/heirloom/vault:/var/lib/heirloom/vault
      - /var/lib/heirloom/lab:/var/lib/heirloom/lab
      - /var/lib/heirloom/lab-reports:/var/lib/heirloom/lab-reports
      - /var/lib/heirloom/observer:/var/lib/heirloom/observer
    depends_on:
      - mongo
      - ollama
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - heirloom

  web:
    build:
      context: ..
      dockerfile: box/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/lib/heirloom/caddy:/data
      - /var/lib/heirloom/caddy-config:/config
    depends_on:
      - api
    networks:
      - heirloom

  chatterbox:
    profiles: ["chatterbox"]
    build:
      context: ..
      dockerfile: box/chatterbox/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    networks:
      - heirloom

networks:
  heirloom:
    name: heirloom-box
