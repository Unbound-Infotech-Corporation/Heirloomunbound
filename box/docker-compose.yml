# Heirloom Twin Box. Host data lives under HEIRLOOM_DATA_ROOT (default /var/lib/heirloom).
# The API listens on 127.0.0.1 only. Other PCs reach it through Caddy on the LAN.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/mongo:/data/db
    networks:
      - heirloom

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    env_file:
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/box.env
    volumes:
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - heirloom

  api:
    build:
      context: ..
      dockerfile: box/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/box.env
    environment:
      HEIRLOOM_OWNER_PASSWORD_FILE: ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/owner/owner.pass
    volumes:
      # Directory, not the file. A missing file bind becomes a directory, and
      # replacing owner.pass by rename would stay invisible inside a file bind.
      # set-owner writes this same path on the host; the API reads it each login.
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/owner:${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/owner:ro
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/vault:${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/vault
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/lab:${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/lab
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/lab-reports:${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/lab-reports
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/observer:${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/observer
      - /run/heirloom-observer:/run/heirloom-observer
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/presence:${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/presence
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/caddy:${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/caddy:ro
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/pause.json:${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/pause.json
    depends_on:
      - mongo
      - ollama
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - heirloom

  web:
    build:
      context: ..
      dockerfile: box/Dockerfile.web
    restart: unless-stopped
    environment:
      HEIRLOOM_LAN_IP: ${HEIRLOOM_LAN_IP:-127.0.0.1}
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/caddy:/data
      - ${HEIRLOOM_DATA_ROOT:-/var/lib/heirloom}/caddy-config:/config
    depends_on:
      - api
    networks:
      - heirloom

  chatterbox:
    profiles: ["chatterbox"]
    build:
      context: ..
      dockerfile: box/chatterbox/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    networks:
      - heirloom

networks:
  heirloom:
    name: heirloom-box
