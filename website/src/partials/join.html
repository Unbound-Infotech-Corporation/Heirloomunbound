<section class="join" id="join" aria-labelledby="join-h">
  <div class="wrap">
    <p class="eyebrow">Founding families</p>
    <h2 id="join-h">Be one of the first families<br>to keep their stories <em>at home</em>.</h2>
    <p class="lead" style="margin:0 auto">We're opening a small private beta first. Leave your email and we'll write once, when there's a spot for you. No newsletters, no sharing your address.</p>
    <form class="form" data-waitlist novalidate>
      <label class="sr" for="wl-email">Email address</label>
      <input id="wl-email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
      <label class="sr" for="wl-int">I'm most interested in</label>
      <select id="wl-int" name="interest">
        <option value="">I'm most interested in…</option>
        <option value="legacy">Preserving my own stories</option>
        <option value="parent">Recording a parent or grandparent</option>
        <option value="assistant">A private local AI assistant</option>
        <option value="twinbox">The Twin Box appliance</option>
        <option value="beta">Beta testing on my PC</option>
      </select>
      <button class="btn btn-gold" type="submit">Join the beta list</button>
      <label class="check"><input type="checkbox" name="consent" required> <span>Email me about the Heirloom beta and launch. I can unsubscribe anytime. See the <a href="privacy.html#site">site privacy note</a>.</span></label>
      <p class="status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
